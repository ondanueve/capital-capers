<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capital Capers - ¡La Carrera Familiar Más Divertida!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka+One&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
  min-height: 100vh;
  color: #2d3436;
  overflow-x: hidden;
}
.container { max-width: 1300px; margin: 0 auto; padding: 15px; }
header {
  text-align: center;
  padding: 25px;
  background: rgba(255,255,255,0.92);
  border-radius: 25px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
  margin-bottom: 20px;
  backdrop-filter: blur(10px);
}
h1 {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(2.5em, 6vw, 4em);
  background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #1dd1a1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: rainbow 4s ease infinite;
}
@keyframes rainbow {
  0%,100% { filter: hue-rotate(0deg); }
  50% { filter: hue-rotate(30deg); }
}
.subtitle { color: #636e72; font-size: 1.3em; margin-top: 8px; font-weight: 700; }
#game-area {
  background: white;
  border-radius: 25px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  padding: 20px;
  position: relative;
}
canvas {
  border-radius: 20px;
  display: block;
  margin: 0 auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  background: linear-gradient(180deg, #dff9fb 0%, #c7ecee 100%);
  max-width: 100%;
  height: auto;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-top: 18px;
}
button {
  font-family: 'Baloo 2', cursive;
  font-weight: 700;
  padding: 14px 28px;
  border: none;
  border-radius: 50px;
  font-size: 1.15em;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 6px 20px rgba(0,0,0,0.18);
}
button:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 25px rgba(0,0,0,0.25); }
button:active { transform: translateY(1px); }
.btn-primary { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: white; }
.btn-secondary { background: linear-gradient(135deg, #48dbfb, #0abde3); color: white; }
.btn-success { background: linear-gradient(135deg, #1dd1a1, #10ac84); color: white; }
.btn-warning { background: linear-gradient(135deg, #feca57, #ff9f43); color: #2d3436; }
#status {
  text-align: center;
  font-size: 1.25em;
  font-weight: 800;
  margin: 12px 0;
  padding: 16px;
  background: linear-gradient(135deg, #fff9e6, #fff3cd);
  border-radius: 18px;
  border-left: 6px solid #feca57;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.player-info {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-top: 15px;
}
.player-card {
  background: white;
  padding: 12px 18px;
  border-radius: 16px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  min-width: 160px;
  text-align: center;
  border: 4px solid #dfe6e9;
  transition: all 0.3s;
}
.player-card.active {
  border-color: #ff6b6b;
  transform: scale(1.08);
  box-shadow: 0 8px 25px rgba(255,107,107,0.3);
}
.money { color: #10ac84; font-weight: 900; font-size: 1.3em; }
.dice {
  display: inline-block;
  width: 50px;
  height: 50px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  font-size: 2em;
  line-height: 50px;
  text-align: center;
  margin: 0 5px;
  animation: bounce 0.5s;
}
@keyframes bounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
footer {
  text-align: center;
  margin-top: 25px;
  color: #2d3436;
  font-size: 0.95em;
  opacity: 0.8;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Capital Capers</h1>
    <p class="subtitle">¡La carrera más loca y colorida por las capitales de Europa!</p>
  </header>
  
  <div id="game-area">
    <div id="status">¡Bienvenido a Capital Capers! Configura los jugadores y comienza la diversión familiar.</div>
    <canvas id="board" width="1100" height="600"></canvas>
    <div class="controls">
      <button id="btnSetup" class="btn-primary">Configurar Jugadores</button>
      <button id="btnRoll" class="btn-success" disabled>Tirar Dados</button>
      <button id="btnCard" class="btn-warning" disabled>Usar Carta</button>
      <button id="btnNext" class="btn-secondary" disabled>Siguiente Turno</button>
    </div>
    <div id="players" class="player-info"></div>
  </div>
  
  <footer>
    Juego 100% original · Familia · Diversión · Gráficos modernos · Sin copyright issues<br>
    Hecho con ❤️ para jugar juntos
  </footer>
</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const playersEl = document.getElementById('players');

let players = [];
let currentPlayer = 0;
let diceValue = 0;
let gameStarted = false;
let stage = 1;
let targetCapital = null;
let chaserOn = null;
const capitals = ['París', 'Berlín', 'Roma', 'Madrid', 'Londres', 'Viena', 'Ámsterdam', 'Praga', 'Lisboa'];
const colors = ['#ff6b6b', '#48dbfb', '#1dd1a1', '#feca57', '#ff9ff3', '#5f27cd', '#00d2d3', '#ff9f43'];
const cardEffects = [
  {name: 'Doble Dado', desc: 'Tira 2 veces', effect: 'double'},
  {name: 'Roba Dinero', desc: '+100 monedas', effect: 'money'},
  {name: 'Salta Casillas', desc: 'Avanza 3 extra', effect: 'skip'},
  {name: 'Intercambia', desc: 'Cambia posición con otro', effect: 'swap'},
  {name: 'Escudo', desc: 'Inmune al Chaser', effect: 'shield'}
];

const nodes = [
  {id:0, x:80, y:300, name:'Inicio', color:'#dfe6e9', type:'start'},
  {id:1, x:180, y:200, name:'', color:'#74b9ff', type:'blue'},
  {id:2, x:280, y:120, name:'', color:'#ffeaa7', type:'yellow'},
  {id:3, x:380, y:180, name:'París', color:'#ffffff', type:'city'},
  {id:4, x:480, y:100, name:'', color:'#ff7675', type:'red'},
  {id:5, x:580, y:200, name:'Berlín', color:'#ffffff', type:'city'},
  {id:6, x:680, y:140, name:'', color:'#55efc4', type:'green'},
  {id:7, x:780, y:220, name:'Roma', color:'#ffffff', type:'city'},
  {id:8, x:880, y:150, name:'', color:'#a29bfe', type:'purple'},
  {id:9, x:980, y:250, name:'Madrid', color:'#ffffff', type:'city'},
  {id:10, x:1000, y:380, name:'', color:'#fd79a8', type:'pink'},
  {id:11, x:900, y:480, name:'Londres', color:'#ffffff', type:'city'},
  {id:12, x:750, y:520, name:'', color:'#74b9ff', type:'blue'},
  {id:13, x:550, y:480, name:'Viena', color:'#ffffff', type:'city'},
  {id:14, x:350, y:500, name:'', color:'#ffeaa7', type:'yellow'},
  {id:15, x:150, y:420, name:'Meta', color:'#fdcb6e', type:'end'}
];

function drawBoard() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const sky = ctx.createLinearGradient(0,0,0,canvas.height);
  sky.addColorStop(0, '#81ecec');
  sky.addColorStop(0.6, '#dfe6e9');
  sky.addColorStop(1, '#b2bec3');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  drawCloud(150, 60, 40);
  drawCloud(400, 40, 50);
  drawCloud(700, 70, 35);
  drawCloud(950, 50, 45);
  ctx.strokeStyle = '#636e72';
  ctx.lineWidth = 18;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for(let i=0; i<nodes.length-1; i++) {
    ctx.moveTo(nodes[i].x, nodes[i].y);
    ctx.lineTo(nodes[i+1].x, nodes[i+1].y);
  }
  ctx.stroke();
  ctx.strokeStyle = '#ffeaa7';
  ctx.lineWidth = 4;
  ctx.setLineDash([15, 10]);
  ctx.beginPath();
  for(let i=0; i<nodes.length-1; i++) {
    ctx.moveTo(nodes[i].x, nodes[i].y);
    ctx.lineTo(nodes[i+1].x, nodes[i+1].y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  nodes.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x + 3, n.y + 3, n.type === 'city' ? 32 : 26, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.type === 'city' ? 30 : 24, 0, Math.PI*2);
    ctx.fillStyle = n.color;
    ctx.fill();
    ctx.strokeStyle = '#2d3436';
    ctx.lineWidth = 3;
    ctx.stroke();
    if(n.type === 'city') {
      ctx.fillStyle = '#2d3436';
      ctx.font = 'bold 11px Nunito';
      ctx.textAlign = 'center';
      ctx.fillText(n.name, n.x, n.y + 48);
      ctx.font = '16px serif';
      ctx.fillText('🏛️', n.x, n.y + 5);
    } else if(n.type === 'start') {
      ctx.font = '18px serif';
      ctx.fillText('🏁', n.x, n.y + 6);
    } else if(n.type === 'end') {
      ctx.font = '18px serif';
      ctx.fillText('🏆', n.x, n.y + 6);
    }
  });
  players.forEach((p, i) => {
    const node = nodes[Math.min(p.position, nodes.length-1)];
    const offsetX = (i - (players.length-1)/2) * 18;
    const offsetY = -35;
    drawCar(node.x + offsetX, node.y + offsetY, p.color, p.name[0]);
  });
  if(chaserOn !== null && players[chaserOn]) {
    const node = nodes[Math.min(players[chaserOn].position, nodes.length-1)];
    ctx.font = '28px serif';
    ctx.fillText('😈', node.x + 20, node.y - 50);
  }
}

function drawCloud(x, y, size) {
  ctx.beginPath();
  ctx.arc(x, y, size, 0, Math.PI*2);
  ctx.arc(x + size*0.7, y - size*0.2, size*0.8, 0, Math.PI*2);
  ctx.arc(x + size*1.3, y, size*0.7, 0, Math.PI*2);
  ctx.fill();
}

function drawCar(x, y, color, letter) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(-14, -8, 28, 16, 6);
  ctx.fill();
  ctx.strokeStyle = '#2d3436';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#2d3436';
  ctx.beginPath();
  ctx.arc(-8, 6, 5, 0, Math.PI*2);
  ctx.arc(8, 6, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.font = 'bold 11px Nunito';
  ctx.textAlign = 'center';
  ctx.fillText(letter, 0, 2);
  ctx.restore();
}

function updatePlayersUI() {
  playersEl.innerHTML = '';
  players.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'player-card' + (i === currentPlayer ? ' active' : '');
    card.style.borderColor = p.color;
    const cardsCount = p.cards ? p.cards.length : 0;
    card.innerHTML = `<strong>${p.name}</strong><br><span class="money">$${p.money}</span><br>Pos: ${p.position}<br>Cartas: ${cardsCount}`;
    playersEl.appendChild(card);
  });
}

function setupPlayers() {
  const num = parseInt(prompt('¿Cuántos jugadores? (2-6)', '4')) || 4;
  players = [];
  for(let i=0; i<Math.min(Math.max(num,2),6); i++) {
    const name = prompt(`Nombre del jugador ${i+1}`, `Jugador ${i+1}`) || `Jugador ${i+1}`;
    players.push({
      name,
      money: 800,
      position: 0,
      color: colors[i % colors.length],
      cards: [],
      shield: false
    });
  }
  gameStarted = true;
  currentPlayer = 0;
  stage = 1;
  targetCapital = capitals[Math.floor(Math.random()*capitals.length)];
  chaserOn = null;
  statusEl.innerHTML = `¡Etapa ${stage}! Objetivo: llegar a <strong>${targetCapital}</strong>. Turno de ${players[0].name}`;
  document.getElementById('btnRoll').disabled = false;
  document.getElementById('btnSetup').disabled = true;
  drawBoard();
  updatePlayersUI();
}

function rollDice() {
  if(!gameStarted) return;
  diceValue = Math.floor(Math.random()*6) + 1;
  statusEl.innerHTML = `${players[currentPlayer].name} sacó un <span class="dice">${diceValue}</span>!`;
  document.getElementById('btnRoll').disabled = true;
  document.getElementById('btnNext').disabled = false;
  setTimeout(() => movePlayer(diceValue), 600);
}

function movePlayer(steps) {
  const p = players[currentPlayer];
  p.position = Math.min(p.position + steps, nodes.length - 1);
  const node = nodes[p.position];
  if(node.type === 'blue') { p.money += 60; statusEl.textContent += ' +$60 (azul)'; }
  else if(node.type === 'red') { p.money = Math.max(0, p.money - 40); statusEl.textContent += ' -$40 (roja)'; }
  else if(node.type === 'yellow') {
    const card = cardEffects[Math.floor(Math.random()*cardEffects.length)];
    p.cards.push(card);
    statusEl.textContent += ` ¡Carta: ${card.name}!`;
    document.getElementById('btnCard').disabled = false;
  } else if(node.type === 'green') { p.money += 30; }
  else if(node.type === 'city') { p.money += 100; statusEl.textContent += ' +$100 (ciudad)'; }
  if(stage > 1 && chaserOn === null) {
    let minPos = Math.min(...players.map(pl => pl.position));
    chaserOn = players.findIndex(pl => pl.position === minPos);
  }
  if(chaserOn === currentPlayer && !p.shield) {
    p.money = Math.max(0, p.money - 50);
    statusEl.textContent += ' ¡El Chaser te quitó $50!';
  }
  drawBoard();
  updatePlayersUI();
}

function useCard() {
  const p = players[currentPlayer];
  if(p.cards.length === 0) return;
  const card = p.cards.pop();
  if(card.effect === 'money') p.money += 100;
  else if(card.effect === 'skip') p.position = Math.min(p.position + 3, nodes.length-1);
  else if(card.effect === 'shield') p.shield = true;
  else if(card.effect === 'double') { p.money += 50; }
  statusEl.textContent = `${p.name} usó ${card.name}!`;
  document.getElementById('btnCard').disabled = p.cards.length === 0;
  drawBoard();
  updatePlayersUI();
}

function nextTurn() {
  currentPlayer = (currentPlayer + 1) % players.length;
  document.getElementById('btnRoll').disabled = false;
  document.getElementById('btnNext').disabled = true;
  document.getElementById('btnCard').disabled = players[currentPlayer].cards.length === 0;
  statusEl.textContent = `Turno de ${players[currentPlayer].name}. ¡Tira los dados!`;
  if(players.some(p => p.position >= nodes.length-1)) {
    const winner = players.reduce((a,b) => a.money > b.money ? a : b);
    statusEl.innerHTML = `¡${winner.name} gana la etapa con $${winner.money}! Nueva etapa...`;
    stage++;
    players.forEach(p => { p.position = 0; p.shield = false; });
    targetCapital = capitals[Math.floor(Math.random()*capitals.length)];
    chaserOn = null;
    setTimeout(() => {
      statusEl.innerHTML = `¡Etapa ${stage}! Objetivo: <strong>${targetCapital}</strong>`;
      drawBoard();
    }, 1500);
  }
  drawBoard();
  updatePlayersUI();
}

document.getElementById('btnSetup').onclick = setupPlayers;
document.getElementById('btnRoll').onclick = rollDice;
document.getElementById('btnNext').onclick = nextTurn;
document.getElementById('btnCard').onclick = useCard;

drawBoard();
</script>
</body>
</html>
